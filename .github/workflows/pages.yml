name: Build and deploy Hugo to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 매일 07:05 KST(22:05 UTC) 재빌드 → 전날 작업 글 예약 게시.
    # 미래 시각(date) 글은 그 시각이 지난 뒤 빌드가 한 번 더 돌아야 공개되므로 필수.
    - cron: "5 22 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # Hugo 버전 정본은 `.hugo-version` 한 곳뿐이다. devbox의 자동 회고 스크립트도 같은 파일을
      # 읽어 같은 버전을 깐다 — 로컬 빌드 검증이 이 CI 빌드의 예측치로 성립하려면 버전이 같아야
      # 한다. 여기 값을 하드코딩하면 그 등식이 조용히 깨진다.
      - name: Resolve pinned Hugo version
        id: hugover
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"
      - name: Install Hugo CLI
        env:
          HUGO_VERSION: ${{ steps.hugover.outputs.version }}
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
          hugo version
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
