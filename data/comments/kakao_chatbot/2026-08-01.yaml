    고정 단어를 쓰면 닉네임 충돌은 줄일 수 있겠습니다. 다만 다른 대화에서 그 단어가 쓰일 가능성도 있으니, 후보를 정한 뒤 실제 방에서 오작동 여부를 먼저 확인하면 좋겠습니다.

    이슈에는 키워드 설정 확인과 시험 알림까지 한 절차로 묶어두면 알림 누락도 더 쉽게 찾을 수 있겠습니다.
