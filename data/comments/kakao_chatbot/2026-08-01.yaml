    예약시간 알림을 만들기 전에 멘션 가능 여부부터 검증해 불필요한 구현을 막은 판단이 좋았습니다. 실제 송신 통로의 한계까지 확인하고, 불가능한 이유와 우회 방법을 이슈와 기록으로 남긴 점도 다음 판단에 도움이 되겠습니다.

    다음에는 키워드 알림을 쓸 경우 오작동과 사용자별 차이를 어떻게 확인할지 기준도 함께 정리해두면 좋겠습니다.
