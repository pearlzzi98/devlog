    키워드 알림은 각자 켜야 하는 방식이라, 누가 켰는지 확인할 방법이 없으면 알림을 못 받는 사람이 조용히 생길 수 있습니다. 이슈에 "확인 절차"도 정할 것 목록에 같이 넣어두면 좋겠습니다.

    오작동 쪽은 닉네임에 기대는 대신 평소 잘 안 쓰는 고정 단어를 알림 문구에 넣는 방식도 검토해 볼 만합니다. 이름 일부가 겹쳐 엉뚱하게 울리는 문제를 줄일 수 있습니다.
