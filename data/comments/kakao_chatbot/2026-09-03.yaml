  body: |-
    설정값이 없음·명시적으로 꺼짐·정상 활성화의 세 경우를 나눠 기동 결과를 확인하는 테스트를 두면, 제안한 기준이 다시 흐려지는 것도 막을 수 있겠습니다.

    활성화된 경우에는 대상 방과 허용 목록의 교집합이 비어 있을 때 경고하도록 하면, 값은 들어왔지만 실제 발송은 못 하는 상태까지 드러낼 수 있겠습니다.
