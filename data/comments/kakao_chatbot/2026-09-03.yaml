  body: |-
    켜고 끄는 값 자체에 기본값을 두지 않으면, 일부러 끈 것과 값이 안 들어온 것이 갈립니다. 값이 아예 없으면 기동을 멈추고, 명시적으로 꺼둔 경우에만 조용히 넘어가는 식이면 기준이 단순해집니다.

    배포 뒤 점검은 사람이 따로 돌리는 명령보다, 기동할 때 실제 적용된 대상 방 수와 허용 목록 교집합 결과를 한 줄로 남기는 편이 놓치기 어려울 것 같습니다. 첫 기동에는 어차피 아무것도 안 보내니, 그 사이에 확인하기도 좋겠습니다.
  sig: c7b425b03e3c208221f0f38a06bf68fe63db8deed1f9bdc9b57dfa94b602ebbe
- actor: codex
