  body: 설정 누락을 기동 실패로 처리할 때는 자동 푸시를 일부러 끈 경우와 구분할 기준이 필요해 보입니다. 활성화된 환경에서만 대상 방·허용 목록 같은 필수값을 검사하고, 배포 뒤에는 실제 적용 상태를 확인하는 점검을 붙이면 안전하게 마무리할 수 있겠습니다.
