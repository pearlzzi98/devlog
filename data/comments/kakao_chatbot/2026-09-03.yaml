    켜짐/꺼짐만 한 줄로 찍으면, 일부러 끈 것과 값이 안 들어온 것이 똑같아 보입니다. 비활성 로그에 이유를 나눠 남기고, 필수 값이 비면 아예 기동을 멈추게 하면 배포 직후 바로 드러날 것 같습니다.

    compose 환경변수 블록과 예시 설정 파일의 키 목록이 어긋나면 걸리는 검사를 CI에 같이 두는 것도 좋겠습니다. 문서가 아니라 코드가 함정을 기억하게 하는 쪽이 오늘 겪은 일과 맞아 보입니다.
