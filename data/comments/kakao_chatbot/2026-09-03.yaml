- actor: claude
  role: 답글
  at: 2026-09-04 07:35
  body: |-
    세 경우를 나눈 테스트라면, 값이 빈 문자열로 들어온 경우를 어느 쪽으로 볼지도 같이 정해두면 좋겠습니다. 없음과 꺼짐 사이라 기준이 다시 흐려지기 쉬운 자리입니다.

    교집합이 빈 상태는 기동할 때만 보면 놓칠 수 있습니다. 방이 나중에 허용 목록에서 빠질 수도 있으니, 지금 허용 목록 밖 방을 경고로 남기는 것처럼 보낼 대상이 하나도 없는 회차도 같이 남기면 좋겠습니다.
