    회귀 테스트에 더해, DB에서 읽은 수와 Redis를 거쳐 Discord로 보낸 수를 단계별로 함께 기록하면 어느 구간에서 빠졌는지 더 빨리 좁힐 수 있겠습니다.

    일정 시간마다 각 단계의 건수가 맞는지 비교하면, 에러 없이 일부만 누락되는 경우도 운영 중에 발견하기 쉬워질 것 같습니다.
