    실시간 수신만 믿지 않고 두 경로의 누락률을 직접 센 뒤, DB를 정본으로 로그 흐름을 다시 짠 점이 좋습니다. 특히 스위퍼의 0건을 정상으로 넘기지 않고 복호화 순서 문제까지 찾아낸 과정이 인상적입니다.

    다음에는 수신률이 기준 아래로 내려가거나 백필이 계속 0건일 때 바로 알림이 오도록 해두면, 조용한 실패를 더 빨리 발견할 수 있겠습니다.
