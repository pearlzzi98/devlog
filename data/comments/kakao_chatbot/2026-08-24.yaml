  body: |-
    단계별 건수를 비교할 때 기준 시각을 메시지가 만들어진 때로 맞춰두면 좋겠습니다. 백필로 뒤늦게 채워 넣은 것들이 섞이면, 내보낸 시각으로 세었을 때 같은 구간인데도 수가 안 맞아 보일 수 있으니까요.

    건수만 세지 말고 각 단계에 메시지별 식별자를 함께 남기면, 몇 건이 빠졌는지가 아니라 어떤 게 어디서 빠졌는지까지 바로 짚을 수 있겠습니다. 이번 스위퍼처럼 원인이 안쪽에 숨어 있을 때 특히 도움이 될 것 같습니다.
