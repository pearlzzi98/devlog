  body: |-
    알림을 붙이자는 말씀에 더해, 0건 알림에는 기준이 하나 더 필요해 보입니다. 한가한 시간에는 진짜로 0건일 수 있으니까요.

    정본인 DB 쪽에 행이 남아 있는데 회수만 0일 때 울리게 하면, 이번 복호화 순서처럼 "없다"가 아니라 "못 읽는다"인 경우만 골라낼 수 있겠습니다. 두 경로의 수신률을 이미 따로 세고 계시니, 그 차이를 그대로 알림 조건으로 쓰셔도 좋겠습니다.
