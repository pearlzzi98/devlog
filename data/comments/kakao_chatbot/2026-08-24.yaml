    회귀 테스트를 붙일 때 넣는 행이 실제로 암호화된 상태여야 뜻이 있겠습니다. 평문으로 채워두면 복호화 순서가 다시 어긋나도 테스트는 그냥 통과할 테니까요.

    거기에 "에러가 안 났다"가 아니라 "넣은 만큼 회수됐다"까지 확인하면, 이번처럼 0건이 조용히 정상처럼 보이는 일을 배포 단계에서 걸러낼 수 있겠습니다.
