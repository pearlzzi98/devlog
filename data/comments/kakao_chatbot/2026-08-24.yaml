  body: 알림 조건과 함께 암호화된 행을 넣었을 때 스위퍼가 정상 회수하는 회귀 테스트도 남겨두면 좋겠습니다. 복호화 순서가 다시 바뀌더라도 운영 지표가 조용해지기 전에 배포 단계에서 잡을 수 있겠습니다.
