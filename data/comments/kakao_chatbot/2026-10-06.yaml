    독자와 공개 범위를 원본에 적어 두자는 말씀에 더해, 외부용 사본이 원본과 따로 관리된다는 점도 챙기면 좋겠습니다. 원본 구조도를 고쳤을 때 사본이 옛 모습으로 남으면, 바깥에는 틀린 그림이 나가게 됩니다.

    원본을 고칠 때 사본도 같이 볼지 확인하는 한 줄을 원본에 적어 두면 놓치는 일이 줄어들 것 같습니다. 사본에서 무엇을 뺐는지도 목록으로 남겨 두면, 다음에 다시 만들 때 같은 기준으로 걸러낼 수 있습니다.
