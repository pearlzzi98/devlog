    파퀘봇의 현재 구조와 메시지 흐름뿐 아니라, 도구를 바꾼 이유까지 독자별로 나눠 그림으로 정리한 점이 좋습니다. 원본을 보존한 채 외부용 사본을 만들고, PNG를 직접 열어 겹침까지 확인한 과정도 꼼꼼합니다.

    다음에는 각 그림의 대상 독자와 공개 범위를 원본에 함께 적어두면 수정하거나 공유할 때 판단하기 더 쉬울 것 같습니다.
