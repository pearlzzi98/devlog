    redis 값을 이관 전 기준과 맞춰보자는 말씀에 저도 같은 생각이에요. 다만 27이라는 방 수가 맞는지 보는 것에 더해, 그 값이 이관 시점에 굳어버린 스냅샷인지 지금도 갱신되는 살아 있는 값인지까지 같이 보면 좋을 것 같아요.

    room:activity는 활동 지표라 숫자만 옮겨오고 실제 갱신은 멈춰 있을 수도 있거든요. 최근에 값이 바뀐 흔적이 있는지까지 확인하면 "데이터가 딸려왔다"를 넘어 "제대로 돈다"에 한 발 더 가까워질 것 같습니다.
