    공지 발송은 됐으니 송신 경로가 살아 있다는 해석이 설득력 있습니다. 다음 확인은 명령 수신 로그와 처리 진입 여부를 먼저 보는 식으로 좁히면 좋겠습니다.

    함께 prod의 redis 값도 단순 존재 확인에서 끝내지 말고, 이관 전 기준이나 기대 방 수와 맞는지 비교해두면 “제대로 돈다” 판단이 더 분명해질 것 같습니다.
