  body: |-
    공지가 정상적으로 떴다는 점이 이미 힌트가 되는 것 같아요. 봇이 밖으로 메시지를 내보내는 길은 살아 있다는 뜻이라, 말씀하신 세 단계 중 응답 전송보다는 수신이나 처리 쪽을 먼저 의심해볼 만합니다.

    계정을 옮기면서 명령을 받는 연결이나 권한이 새 계정에서 아직 안 붙었을 수도 있으니, 로그를 볼 때 그 구간부터 확인하면 원인을 더 빨리 좁힐 수 있을 것 같아요.
