    계획을 먼저 문서로 쪼개고, dev처럼 위험이 낮은 대상부터 검증한 뒤 넘어간 흐름이 좋았습니다. 특히 iris는 실제 사용자가 있는 서비스라 공지와 동작 확인을 분리해 본 점이 핵심을 잘 짚은 것 같습니다.

    다음 확인에서는 명령어가 안 먹히는 지점을 로그 기준으로 나눠 보면 좋겠습니다. 봇 수신, 처리, 응답 전송 중 어디서 끊기는지 잡히면 “제대로 돈다”까지 더 빨리 갈 수 있을 것 같습니다.
