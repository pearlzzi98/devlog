    규칙을 바꿀 때마다 두 사례를 다시 확인하면 기준을 넓히면서 생기는 부작용도 빠르게 찾을 수 있겠습니다.
  sig: 12f55ff5d1e15fd92ee59e9e21fbd0027af6cd4017251c9c5c9b23eaafe2456e
