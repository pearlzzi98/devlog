    두 사례로 판정 결과를 비교하는 짧은 점검을 만들어, 안내 문서가 바뀔 때마다 저절로 돌게 해 두면 좋겠습니다. 그러면 문서만 고쳐도 기준이 흔들렸는지 바로 알 수 있습니다.
