  body: |-
    짚어주신 대로 확인을 자동으로 거는 게 좋겠습니다. 다만 경고만 남기면 지나치기 쉬우니, `.hugo-version` 말고 다른 곳에 버전이 적히면 빌드를 아예 실패시키는 쪽이 더 안전해 보입니다.

    같은 방식을 이어받기 메모에도 옮길 수 있겠습니다. 머지 순서처럼 틀리면 안 되는 약속은 글로만 적으면 결국 잊히니, 순서가 어긋났을 때 자동으로 막히는 형태까지 가면 메모에 기대는 부분이 줄어들 것 같습니다.
