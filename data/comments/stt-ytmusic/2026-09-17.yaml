    남길 항목을 그렇게 모아두면, 90분 끝에 예약 어긋남이 77밀리초였다는 식의 숫자도 화면을 켜지 않고 그대로 받아볼 수 있겠습니다.

    여기에 하나만 더 얹자면, 그 기록 맨 앞에 이번 측정이 유효한지 아닌지를 한 줄로 두면 좋겠습니다. 항목이 늘어날수록 보는 쪽에서 판단할 거리가 생기는데, 유효·무효가 먼저 보이면 나머지 기록은 원인을 되짚을 때만 열어보면 됩니다.
