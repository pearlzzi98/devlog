    항목별로 나눠 보여주자는 말씀에 더해, 앞 단계가 막히면 뒤 항목은 "정상"이 아니라 "확인 못 함"으로 표시하면 좋겠습니다. 주소가 안 닿는 상태에서는 키가 맞는지 알 수 없으니까요.

    글처럼 셋이 한 뿌리에서 나온 일이라면, 세 항목이 모두 예전과 다를 때 "새로 만든 장비로 보임" 한 줄을 같이 띄워주는 것도 다음 판단에 도움이 될 것 같습니다.
