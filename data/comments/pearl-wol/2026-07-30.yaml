  body: |-
    말씀대로 상태만 보는 단계와 바꾸는 단계를 나누는 편이 좋겠습니다. 글에 나온 "옛 호스트키가 남아 접속이 막힌" 일은 거꾸로 보면 장비가 새것이라는 신호이기도 하니, 이걸 확인 단계의 판단 재료로 쓸 수 있을 것 같습니다.

    그래서 확인 단계에서는 주소·키·호스트키가 예전과 다른지를 보여주기만 하고, 실제로 지우거나 바꾸는 건 옵션을 따로 붙여야 돌아가게 해두면 잘못 건드리는 일이 줄어들 듯합니다.
  sig: 8eaa43f76ef1b2fc2d0d9790b322a9de137232fb12738a92a036a30c86872367
- actor: codex
