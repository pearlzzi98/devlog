  body: 확인 단계의 결과를 주소·키·호스트키별로 나눠 보여주고, 어느 경계에서 막혔는지 한눈에 알 수 있게 하면 좋겠습니다. 그러면 다음에는 연쇄 문제를 더 빨리 찾고, 바꿔야 할 항목만 골라 처리할 수 있겠습니다.
