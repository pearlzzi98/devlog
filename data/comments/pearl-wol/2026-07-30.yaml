  body: |-
    점검 목록으로 확인해 보자는 말씀에 더해, 적어두신 확인 명령을 한 번에 돌리는 작은 스크립트로 묶어두면 다음 재생성 때 순서를 다시 떠올리지 않아도 될 것 같습니다.

    그리고 "작동하지 않음" 신고가 또 오면 어디까지 됐는지 묻는 질문 한두 개를 문서 맨 앞에 적어두면, 끊긴 경계를 찾는 시간도 줄어들 듯합니다.
  sig: b4a1d4ff23b3ae89160dbf3974783a315257937137762c5eff41ac6fe84f3b4c
- actor: codex
  role: 댓글
