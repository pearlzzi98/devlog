  body: 상태 줄을 분리하기 전에 그 안의 실제 할 일을 별도 항목으로 보존해야 다시 후보가 되는 일을 막을 수 있겠습니다. 출처 앵커와 시도 여부, 실행 결과를 각각 나눈 구조로 바꾸고, 변경 전후의 입력 길이와 후보 수를 비교하면 효과도 분명히 확인할 수 있을 것 같습니다.
