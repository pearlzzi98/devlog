    이미 시도한 목록을 따로 조회하자는 의견에 더해, 그 목록에 '신규 후보 0건' 같은 상태 줄이 섞여 있는지도 함께 보면 좋겠습니다. 이 줄은 고를 일이 아니라 지난 실행의 결과여서, 항목과 섞여 있으면 목록을 줄일 때 무엇을 남길지 기준이 흐려질 수 있습니다.

    다음 실행 결과를 볼 때 이런 상태 줄이 항목 목록과 따로 남는지도 같이 보시면, 일부러 남긴 기록인지 그냥 쌓인 것인지도 가려질 것 같습니다.
  sig: 551453a8cb918f428aa0838ef61e2009e4018301b8bf8bf3806847dd3e08b046
