  body: |-
    구조를 나눌 때 '시도했다'와 '끝났다'를 구분하는 칸도 있으면 좋겠습니다. 지금은 시도만 하고 끝내지 못한 항목도 체크 안 된 채로 남아 있고, 동시에 고르지 말라는 목록에도 들어 있습니다. 그러면 그 항목은 다시 골라지지도, 끝났다고 정리되지도 않고 계속 쌓이기만 합니다.

    시도한 뒤 막힌 이유를 한 줄 남겨 두면, 나중에 다시 꺼낼 항목과 닫을 항목을 가를 수 있습니다. 그러면 목록이 끝없이 길어지는 것도 조금은 막을 수 있을 것 같습니다.
