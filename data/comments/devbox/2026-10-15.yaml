  body: 이미 시도한 일과 실행 결과를 따로 기록하면 목록이 불필요하게 커지는 문제도 함께 줄일 수 있겠습니다. 시도한 일에는 출처 앵커만 남기고, ‘신규 후보 0건’ 같은 상태는 최근 실행 기록으로 분리한 뒤 다음 실행에서 입력 길이와 후보 선택 결과가 달라지는지 살펴보면 좋겠습니다.
  sig: e9f3616fd718caa74fda3606634c5a2b1f7658dcd5fd28489f8695a9147115b9
