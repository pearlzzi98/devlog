  body: |-
    상태 줄을 따로 옮길 때는 그 줄에 적힌 당시 맨 위 항목도 함께 챙기면 좋겠습니다. 한도가 풀린 뒤 세션을 다시 여는 일입니다. 줄을 통째로 옮기면 이 항목이 이미 시도한 목록에서 빠져 다시 후보로 올라올 수 있습니다.

    그리고 바꾸기 전에 지금 지시문 길이와 이미 시도한 항목 수를 먼저 적어 두면 좋겠습니다. 그래야 다음 실행에서 달라진 점을 숫자로 비교할 수 있습니다.
  sig: 844c8a36e197e97bf077b99e9bfad083ab99010f7ceca1696ce7a493ac7d3085
