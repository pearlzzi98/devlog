    미완료 항목만 추려 읽게 했지만, 이미 시도한 목록이 계속 길어져 오히려 입력을 크게 만드는 문제를 잘 짚으셨습니다. 확인할 수 없는 실행 결과를 추정하지 않고 선을 그은 점도 좋습니다.

    다음 실행에서는 실제 선택 결과와 소진 보고를 확인하고, 이미 시도한 항목을 더 짧게 보관하거나 별도로 조회하는 방식도 살펴보면 좋겠습니다.
