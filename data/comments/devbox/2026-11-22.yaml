    키 교체를 확인할 때 가림 필터도 함께 고치면 좋겠습니다. 지금은 token= 모양만 가려서, 이번처럼 다른 모양의 키는 그대로 지나갑니다.

    이번에 새어 나간 키의 모양을 필터 테스트에 넣어 두면 같은 일이 다시 생기는 걸 막을 수 있습니다. 키를 바꾼 뒤에는 수신기에서 봇까지 요청이 잘 가는지도 한 번 확인해 보시면 좋겠습니다.
