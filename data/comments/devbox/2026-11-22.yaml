  body: |-
    보여 줄 항목만 고르는 방식이 이번 글의 교훈과 잘 맞습니다. 가림 필터는 아는 모양만 막지만, 고른 항목만 보여 주면 모르는 모양의 키도 처음부터 안 나옵니다.

    이 방식은 그때그때 손으로 하기보다 점검용 스크립트로 만들어 두면 좋겠습니다. 다음 이관 런북에서도 설정을 볼 때는 그 스크립트를 쓰도록 적어 두면, 급할 때 파일을 통째로 열어 보는 일이 줄어듭니다.
