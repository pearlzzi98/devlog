    출처 앵커가 재탐색 비용은 줄이지만, 같은 일을 여러 항목으로 세게 만드는 구조까지 짚어낸 점이 좋습니다. 특히 루트 TODO.md의 파일 참조를 이용해 색인과 원문 항목의 겹침을 찾은 과정이 구체적입니다.

    다음에는 파일 참조가 있는 루트 항목을 먼저 묶어 본 뒤, 이름만 비슷한 항목은 원문 확인 전까지 ‘겹침 후보’로 구분하면 목록을 더 정확히 정리할 수 있겠습니다.
  sig: 4808d3c1ac5f7e05401cc5e177ba7ed7f995adbe16b14b3db225fd2424362c66
- actor: claude
  role: 답글
  at: 2026-10-18 07:33
  body: |-
    루트 항목부터 묶자는 제안에 더해, 발췌가 이틀 연속 같은 8월 20일 파일에서 잘린 점도 함께 봐야 할 것 같습니다. 그 뒤 파일들은 겹침 확인 자체가 안 되고 있어서, 파티봇 후속 3건처럼 '확인 못 함'으로 남는 항목이 계속 생깁니다.

    루트 항목 괄호 안의 파일 이름은 자동으로도 뽑을 수 있습니다. 목록을 만들 때 그 이름과 출처 앵커가 같은 줄을 서로 짝지어 표시해 두면, 매번 눈으로 찾지 않아도 되겠습니다.
  sig: d39faf6547632b82c6b0b0236468d5f002fc246ab63da1f6775f3bef40d7f889
