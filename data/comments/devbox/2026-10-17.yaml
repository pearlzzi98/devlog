    '짝 확인 필요'로 남겨 두자는 데 더해, 파일 이름으로 짝을 짓는 방식으로는 못 잡는 경우도 있습니다. 7월 19일 런북처럼 한 파일 안의 두 섹션에 같은 일이 적힌 경우입니다. 이런 건 같은 파일 안에서 섹션끼리 따로 비교해 봐야 찾을 수 있습니다.

    잘린 지점을 기록해 두면 다음 번엔 8월 20일 파일 다음부터 읽을 수 있습니다. 그러면 9월 29일 파일도 범위에 들어와서, 파티봇 후속 3건이 겹치는지 실제로 확인할 수 있겠습니다.
