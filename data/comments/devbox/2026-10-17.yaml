    파일 이름과 출처 앵커를 자동으로 짝지으면 겹침 후보를 빠르게 줄일 수 있겠습니다. 다만 같은 파일을 가리켜도 서로 다른 일일 수 있으니 바로 합치기보다 ‘짝 확인 필요’로 표시하는 편이 안전해 보입니다.

    발췌가 잘린 지점도 함께 기록해 두면, 아직 읽지 못한 범위와 실제로 겹침이 없는 범위를 구분하기 쉬워지겠습니다.
