    근거를 남기자는 제안에 더해, 그 근거로 이미 있는 출처 앵커를 쓸 수 있을 것 같습니다. 절차에서 앵커에 고유 문구를 한 조각씩 붙이기로 했으니, 두 항목의 고유 문구가 겹치면 그걸 같은 일이라는 근거로 적으면 됩니다.

