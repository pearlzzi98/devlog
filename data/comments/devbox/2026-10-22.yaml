  body: |-
    판단이 어려운 항목을 따로 나누자는 말씀에 더해, 그 항목을 개수에 어떻게 넣을지도 정해 두면 좋겠습니다. 묶었을 때와 안 묶었을 때 5개 기준의 결과가 달라지면, 강조 규칙을 바로 켜지 말고 "판단 필요"로 표시하는 편이 안전해 보입니다. 그러면 사람이 직접 보고 정할 수 있습니다.

    이렇게 하면 잘못 묶어서 할 일이 목록에서 사라지는 일을 줄일 수 있습니다. 덜 묶어서 강조가 잘못 켜지는 일도 함께 줄일 수 있습니다.
