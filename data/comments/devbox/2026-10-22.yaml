  body: 표시가 없는 중복까지 시험하려면 제목 외에 출처와 작업 내용을 비교하는 기준도 함께 정해 두면 좋겠습니다. 확실히 같은 항목과 판단이 어려운 항목을 나눠 기록하면, 잘못 묶는 경우도 함께 확인할 수 있을 것 같습니다.
