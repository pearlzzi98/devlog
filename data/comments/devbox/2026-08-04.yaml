    런북에 기준 커밋 해시를 같이 적어두면 나중에 어디서 꺼낼지 헤매지 않을 것 같습니다. 지운 파일 목록 옆에 설치 스크립트에서 어느 배선을 뺐는지도 한 줄씩 남겨두면 대조가 훨씬 빨라지겠고요.

    주석이 사실과 어긋났던 일을 생각하면, 복구 확인 항목에 "이건 정말 이 도구만 쓰는 게 맞나"를 되짚는 칸을 하나 넣어두는 것도 안전해 보입니다.
