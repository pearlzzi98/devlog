    복구 절차를 시험할 때는 실제 작업 환경과 분리된 곳에서 진행하고, 설치 뒤 서비스·포트·세션 기록 파일까지 확인 항목으로 묶어두면 좋겠습니다.

    특히 오래된 주석처럼 문서와 실제 사용처가 어긋날 수 있으니, 복구 시점에 현재 구조와 다시 대조하는 단계도 필요해 보입니다.
