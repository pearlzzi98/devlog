    말씀하신 기준에 하나 더 얹자면, 자동 되살림 장치를 붙이기 전에도 같은 질문을 걸어두면 좋겠습니다. 이번에도 1분마다 되살리는 감시가 정작 안 쓰는 화면을 붙들고 있었으니까요.

    그리고 런북에 적어둔 복구 절차는 한 번 실제로 꺼내보는 편이 안전해 보입니다. 같은 세션 기록 파일을 동시에 열면 깨진다는 경고도 그 복구 절차 안에 묶어두면, 다시 깔 때 놓치지 않을 것 같습니다.
