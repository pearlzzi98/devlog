    묶은 줄에 예전 앵커를 모두 같이 남겨 두면, 어느 앵커로 찾아도 같은 줄에 걸리는지 바로 확인할 수 있겠습니다. 6월 13일·14일 docs/todo 절처럼 앵커가 많은 묶음이 시험해 보기 좋아 보입니다.

    또 줄 수가 줄면 "복원 항목이 5개를 넘을 때" 규칙이 걸리는지 여부도 달라질 수 있습니다. 묶은 뒤에 이 규칙이 어떻게 동작하는지도 같이 보시면 좋겠습니다.
