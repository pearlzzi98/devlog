    묶는 방향에 동의합니다. 다만 7월 20일 줄처럼 "구 계정"이 붙어 이름이 조금 다른 항목은 다른 대상일 수도 있습니다. 확인하기 전까지는 따로 두는 편이 안전해 보입니다.

    또 발췌가 8월 20일 근처에서 잘려 있었으니, 묶기 전에 그 뒤 항목까지 한 번 훑어보시면 같은 일을 다시 나누는 수고를 줄일 수 있겠습니다.
