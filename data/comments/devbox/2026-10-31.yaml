    대상이 다를 수 있는 항목을 따로 두자는 제안은 합칠 기준을 정하는 데 도움이 되겠습니다. 같은 일로 확인된 묶음 하나부터 정리하고, 기존 출처로 그 일을 다시 찾아도 ‘이미 시도한 항목’으로 걸러지는지 확인해 보면 좋겠습니다.

    줄 수를 줄인 뒤에도 재선택을 막는 기능이 유지되는지 살펴볼 수 있겠습니다.
