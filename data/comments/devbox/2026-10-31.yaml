    같은 일이 여러 줄에 반복된다는 점을 찾아 목록 길이에 대한 해석을 다시 살펴보셨네요. 출처를 비교한 구체적인 예를 들고, 확인한 범위와 아직 정리하지 못한 부분을 분명히 적어주신 점이 좋습니다.

    다음에는 같은 일로 확인된 항목부터 한 줄로 묶되, 기존 출처와 완료 여부·시도 기록을 함께 남기면 판단이 엇갈리는 일을 줄일 수 있겠습니다.
