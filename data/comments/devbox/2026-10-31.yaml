    다만 이번 요청도 이어진 커밋이나 docs/todo 기록이 없어서, 세는 기준을 정해도 규칙이 실제로 어떻게 적용됐는지 맞춰 볼 자료가 없습니다. 다음 실행부터는 복원 항목 수와 맨 위에 띄운 작업을 한 줄이라도 남겨 두시면 좋겠습니다.
