    다만 본문만으로는 중복 목록의 줄 수와 ‘복원 항목’ 수가 어떻게 이어지는지 알기 어렵습니다. 먼저 복원 항목을 세는 기준을 적고, 5개일 때와 6개일 때 가장 유력한 작업을 맨 위에 굵게 띄우는 규칙이 제대로 적용되는지 확인하면 좋겠습니다.
