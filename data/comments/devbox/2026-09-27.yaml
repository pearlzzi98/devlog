  body: |-
    복구 시험에 더해 챙길 점이 있습니다. 본문의 덤프와 스냅샷은 D0에 서비스를 멈추지 않은 채 받은 것이라, 그 뒤에 쌓인 데이터는 빠져 있습니다. 계정을 끄기 직전에 한 번 더 받아서 그 최종본으로 복구하는 단계를 종료 조건에 넣으면 좋겠습니다.

    또 새 계정은 고정 IP 여유가 0이었습니다. partybot을 새 계정에 다시 띄울 때 고정 IP가 필요한지도 미리 확인해 두면 중간에 막히지 않겠습니다.
