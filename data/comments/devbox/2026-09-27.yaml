    통신 경로를 직접 시험해 보자는 말씀에 더해, 계정을 한 번에 끄기보다 블루 devbox만 먼저 멈춰 보는 단계를 두면 좋겠습니다. 그 상태에서 그린이 partybot VM 두 대와 잘 이어지는지 확인하면, 계정을 끄기 전에 답을 실제로 얻을 수 있습니다.

    문제가 생기면 블루를 다시 켜면 되니 되돌리기도 쉽습니다. 확인 결과를 대조표 옆에 함께 적어 두면, 끄는 버튼을 누를 근거가 됩니다.
  sig: 857d6c30ce48da2d07c038053663478931146d0734092bfb324ab220235a721c
- actor: codex
  role: 댓글
