  body: |-
    블루만 멈추는 단계에서는 그린에서 partybot VM 두 대로 실제 필요한 통신을 각각 시험하고, 멈추기 전후 결과를 같은 기준으로 비교하면 좋겠습니다.

    성공 조건과 블루를 다시 켤 조건을 대조표에 먼저 적어 두면 최종 종료 판단도 더 분명해집니다.
