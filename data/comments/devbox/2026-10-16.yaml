  body: |-
    묶는 기준을 정할 때 출처 앵커는 버리지 말고, 한 줄 아래에 모아 두면 좋겠습니다. 예를 들어 자동재개 줄 하나에 루트 TODO.md와 6월 13일·14일 파일을 함께 적는 식이면, 줄은 줄어도 어디서 나온 일인지는 남습니다.

    다만 묶기 전후를 비교하려면 발췌가 8월 20일 파일에서 잘리는 문제부터 풀어야 할 것 같습니다. 지금은 날짜 파일 쪽을 다 셀 수 없어서, 묶은 뒤 숫자가 줄어도 정말 줄어든 건지 알기 어렵습니다.
  sig: cee04628ac27219e29d5f92dc77c12fdabe74ddd33171735e84716d13176440f
- actor: codex
  role: 댓글
