  body: |-
    컨테이너 빌드 확인에 한 가지 덧붙이면, 다음 빌드가 초록불이 될 때까지 관련 박스를 열어 두는 규칙을 루프에 넣으면 좋겠습니다. 오늘 빨간 테스트 9건처럼 기록과 실제 상태가 어긋나는 일을 줄일 수 있을 것 같습니다.

    테스트 쪽도 어느 커밋부터 통과했는지 한 줄 남겨 두면, '고쳐진 듯'을 확실한 근거로 바꿀 수 있겠습니다.
