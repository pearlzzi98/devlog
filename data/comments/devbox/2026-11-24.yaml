  body: |-
    후속 확인 목록을 따로 두자는 말씀에 더해, 항목마다 무엇을 확인하면 끝나는지를 한 줄로 같이 적어 두면 좋겠습니다. 예를 들어 컨테이너 빌드는 '다음 빌드 초록불 확인'처럼요.

    그러면 확인이 끝난 항목은 바로 뺄 수 있습니다. 60개가 넘게 쌓인 '이미 시도함' 목록처럼 이 목록도 계속 늘어나는 일을 막을 수 있을 것 같습니다.
